# Workflow
name: Hello World Workflow

# Trigger: Defines when the workflow should run.
on:
  workflow_dispatch:

# Jobs: Defines what the workflow should do.
# A workflow can contain one or more jobs, hence we use 'jobs'.
# 'jobs' is an object, so proper indentation is required.
jobs:
  # First Job (use proper indentation).
  say-hello:
    # Creates an ephemeral GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    # The ephemeral runner executes a series of steps.
    # Hence, we define those steps using 'steps'.
    # The 'run:' keyword specifies the commands to execute.
    steps:
      - name: Say Hello World
        run: |
          echo "Hello World"
          echo "Welcome to GitHub Actions"
          echo "Learning CI/CD"