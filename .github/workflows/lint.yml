# Goal: Automatically check Python code for linting errors whenever a Python file changes.

name: Auto Lint Workflow

# Trigger: Run workflow when Python files are pushed.
on:
  push:
    paths:
      - "**.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Ruff
      - name: Install Ruff
        run: pip install ruff

      # Check for linting errors
      - name: Run Ruff Linter
        run: ruff check .
