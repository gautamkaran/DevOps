# What is the goal of this workflow?
# Goal: Whenever someone changes the python code, the linter should run to check for any errors in the code.

name: Auto Lint Workflow

on:
  push:
    paths:
      - "**/*.py"
  pull_request:
    paths:
      - "**/*.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Ruff
      - name: Install Linter
        run: pip install ruff

      # Check for linting errors
      - name: Check for linting errors
        run: ruff check .

      # Check code formatting
      - name: Check code formatting
        run: ruff format --check .